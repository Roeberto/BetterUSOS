name: Build APK

# Buduje APK przy każdym pushu na main i wystawia go jako gotowy do pobrania
# — bez żadnych sekretów w CI, bo appka nigdy nie zna klucza USOS (idzie
# przez serwer podpisujący, patrz proxy/), więc ten APK jest bezpieczny do
# publikacji nawet w publicznym repo i działa od razu po instalacji.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Bez osobnego kroku instalującego SDK: runnery ubuntu-latest mają
      # Android SDK już preinstalowany (ANDROID_HOME, platformy, build-tools,
      # zaakceptowane licencje). `android-actions/setup-android@v3` próbował
      # doinstalować przestarzały pakiet "tools" (`sdkmanager tools`), którego
      # Google już nie serwuje w repozytorium SDK — akcja jest nieaktualizowana
      # i zawsze na tym padała (exit 1, "Failed to find package 'tools'").
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # appVersionCode = numer builda GitHub Actions (rośnie z każdym pushem)
      # — appka porównuje go z własnym BuildConfig.VERSION_CODE, żeby
      # wykryć nowszą wersję na GitHubie (patrz update/UpdateChecker.kt).
      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain -PappVersionCode=${{ github.run_number }}

      # Zapasowo: APK dostępny też jako artefakt tego konkretnego builda
      # (zakładka Actions → wybrany run → Artifacts), przydatne do
      # sprawdzenia konkretnego commita.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Każdy push tworzy osobny, w pełni wersjonowany release (tag
      # "0.<numer builda>") zamiast wiecznie nadpisywać jeden i ten sam
      # "latest-build" — ten drugi wariant w GitHubie zawsze pokazywał
      # martwą datę PIERWSZEGO utworzenia tagu (np. "2 września"), mimo że
      # plik w środku był świeży, i nie dawał żadnej historii wersji.
      # `prerelease: false`, więc GitHub pokazuje go jako prawdziwy
      # "Latest release" (nie wyszarzony pre-release) z poprawną datą i
      # numerem. Stały link do pobrania NIE wymaga znajomości numeru
      # builda — "releases/latest/download/<plik>" to oficjalny,
      # przekierowujący alias GitHuba na najnowszy pełny release (patrz
      # Config.RELEASE_APK_URL / README).
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "0.${{ github.run_number }}"
          name: "Wersja 0.${{ github.run_number }}"
          body: |
            Automatycznie zbudowany APK z commita `${{ github.sha }}` na
            `main`. Działa od razu po instalacji — bez żadnej ręcznej
            konfiguracji.

            versionCode: ${{ github.run_number }}
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
