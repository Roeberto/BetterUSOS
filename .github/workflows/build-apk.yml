name: Build APK

# Buduje APK przy każdym pushu na main i wystawia go jako gotowy do pobrania
# — bez żadnych sekretów w CI, bo appka nie ma wbudowanego na stałe klucza
# USOS (patrz Config.kt/CredentialsStore) — użytkownik podaje go sam przy
# pierwszym uruchomieniu, więc ten APK jest bezpieczny do publikacji nawet
# w publicznym repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      # Zapasowo: APK dostępny też jako artefakt tego konkretnego builda
      # (zakładka Actions → wybrany run → Artifacts), przydatne do
      # sprawdzenia konkretnego commita.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Główny sposób pobrania: jeden, stały link — każdy push nadpisuje
      # ten sam release "latest-build" świeżym APK.
      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Najnowszy build (${{ github.sha }})"
          body: |
            Automatycznie zbudowany APK z najnowszego commita na `main`
            (${{ github.sha }}). Po instalacji appka poprosi o podanie
            Consumer Key/Secret z usosapps.po.edu.pl/developers — patrz
            README.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
